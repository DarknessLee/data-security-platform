services:
  mysql:
    image: mysql:8.0
    container_name: datasec-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: DataSec_root_2026
      MYSQL_DATABASE: datasec
      MYSQL_USER: datasec
      MYSQL_PASSWORD: DataSec_2026
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
      - --lower_case_table_names=1
    ports:
      - "13306:3306"
    volumes:
      - datasec-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pDataSec_root_2026"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: datasec-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "DataSec_2026"]
    ports:
      - "16379:6379"
    volumes:
      - datasec-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "DataSec_2026", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  datasec-mysql-data:
  datasec-redis-data:
